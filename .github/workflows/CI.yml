name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            generator: Ninja
          - os: windows-latest
            generator: Ninja

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes doxygen

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a42af01b72c28a8e1d7b48107b33e4f286a55ef6

      - name: Configure
        run: cmake --preset default -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCustomLibrariesRequireDoxygen=${{ runner.os == 'Linux' }}

      - name: Build
        run: cmake --build build --config Debug

      - name: Build API documentation
        if: runner.os == 'Linux'
        run: cmake --build build --target CustomLibrariesDoxygen --config Debug

      - name: Audit internal API documentation
        if: runner.os == 'Linux'
        run: cmake --build build --target CustomLibrariesDoxygenInternalAudit --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Repeated regression
        run: |
          ctest --test-dir build --output-on-failure --repeat until-fail:20 -R "^TestStress$" -C Debug
          ctest --test-dir build --output-on-failure --repeat until-fail:10 -R "^TestWeb$" -C Debug
